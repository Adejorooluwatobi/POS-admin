<!-- MAIN LAYOUT SHELL -->
<div style="display:flex;height:100vh;overflow:hidden;background:var(--bg);position:relative;">
  <!-- SIDEBAR -->
  <app-sidebar></app-sidebar>

  <!-- MAIN COLUMN -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;">
    <!-- Top bar -->
    <app-header></app-header>

    @if (authService.currentUser()?.mustChangePassword) {
      <div style="background:rgba(239,68,68,0.12);border-bottom:1px solid rgba(239,68,68,0.25);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;color:var(--red);font-size:12px;font-weight:700;flex-wrap:wrap;gap:8px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Temporary Credentials Active: You are required to set a permanent password (and cashier PIN if applicable) before accessing other modules.</span>
        </div>
        <a routerLink="/app/profile" [queryParams]="{ requirePasswordChange: 'true' }" style="color:inherit;text-decoration:underline;">Complete Setup in Profile →</a>
      </div>
    }

    <!-- Page content -->
    <main style="flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg);" id="pageContent">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- FLOATING BOTTOM TOUR DOCK -->
  <app-tour-dock></app-tour-dock>
</div>
