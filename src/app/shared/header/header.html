<header style="background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.02);z-index:20;gap:12px;">

  <!-- Left: Global Search & Live Active Store Pill -->
  <div style="display:flex;align-items:center;gap:12px;flex:1;max-width:520px;min-width:240px;">
    <!-- Global Search Input -->
    <div style="position:relative;width:100%;max-width:340px;display:flex;align-items:center;">
      <svg style="position:absolute;left:10px;width:15px;height:15px;color:var(--text3);pointer-events:none;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text"
             class="inp"
             style="padding-left:32px;padding-right:42px;height:34px;border-radius:9px;font-size:12px;background:var(--surface2);"
             placeholder="Search transactions, SKUs, terminals..."
             (input)="onSearch($event)" />
      <span class="mono" style="position:absolute;right:8px;padding:1px 5px;border-radius:5px;background:var(--surface3);color:var(--text3);font-size:9.5px;border:1px solid var(--border);">⌘K</span>
    </div>

    <!-- Active Store Status Pill -->
    <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);white-space:nowrap;flex-shrink:0;">
      <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);" class="animate-pulse"></span>
      <span style="font-size:11px;font-weight:600;color:var(--text);">Store Open</span>
      <span style="font-size:11px;color:var(--text3);">• Reg Active</span>
    </div>
  </div>

  <!-- Right: Quick Actions, Theme Toggle, Notifications & Profile -->
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">

    <!-- Super admin store switcher (if applicable) -->
    @if (authService.currentUser()?.role === 'SUPER_ADMIN') {
      <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
        <span style="font-size:11px;color:var(--text3);">Store:</span>
        <select class="inp" style="width:auto;height:32px;padding:3px 24px 3px 8px;font-size:11px;" (change)="switchStore($any($event.target).value)">
          <option value="all">All Stores (Global)</option>
          <option value="LG-01">VI Flagship Store</option>
          <option value="LG-02">Ikeja Branch</option>
        </select>
      </div>
    }

    <!-- Quick Action: Cash In / Out -->
    <a [routerLink]="['/app/till-sessions']" class="btn btn-secondary" style="height:32px;padding:0 10px;font-size:11.5px;border-radius:8px;gap:5px;">
      <svg style="width:14px;height:14px;color:var(--text2);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
      </svg>
      <span>Cash In / Out</span>
    </a>

    <!-- Quick Action: + New Product -->
    <a [routerLink]="['/app/products/new']" class="btn btn-primary" style="height:32px;padding:0 12px;font-size:11.5px;border-radius:8px;gap:5px;">
      <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span>New Product</span>
    </a>

    <!-- Notification Bell -->
    <button type="button" class="btn btn-secondary" style="position:relative;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;" title="Notifications">
      <svg style="width:15px;height:15px;color:var(--text2);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span style="position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;">3</span>
    </button>

    <!-- Theme Toggle (Light / Dark) -->
    <button (click)="themeService.toggleTheme()"
            type="button"
            class="btn btn-secondary"
            style="width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;"
            [title]="themeService.theme() === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
      @if (themeService.theme() === 'dark') {
        <svg style="width:15px;height:15px;color:var(--amber);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg style="width:15px;height:15px;color:var(--text2);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    <!-- Divider -->
    <div style="width:1px;height:22px;background:var(--border);margin:0 2px;"></div>

    <!-- User Profile Badge -->
    <a [routerLink]="['/app/profile']" style="display:flex;align-items:center;gap:7px;text-decoration:none;cursor:pointer;padding:2px 6px;border-radius:8px;">
      <div style="width:28px;height:28px;border-radius:50%;background:var(--accent-d);border:1.5px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;" class="font-headline">
        {{ getUserInitials() }}
      </div>
      <div style="line-height:1.2;text-align:left;">
        <div style="font-size:11.5px;font-weight:600;color:var(--text);">{{ getUserDisplayName() }}</div>
        <div style="font-size:9.5px;color:var(--text3);">{{ getUserRoleLabel() }}</div>
      </div>
    </a>

    <!-- Terminal Launcher -->
    <a href="pos-terminal-v2.html" target="_blank" class="btn btn-secondary" style="font-size:11px;padding:4px 8px;border-radius:7px;gap:3px;" title="Open POS Terminal">
      <span>POS</span>
      <svg style="width:11px;height:11px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
    </a>

  </div>

</header>
